<div class="auth-form">
  <h2>Log in</h2>

  <label>
    Email
    <input type="email" [(ngModel)]="email" name="email" />
  </label>

  <label>
    Password
    <input type="password" [(ngModel)]="password" name="password" />
  </label>

  <div class="error" *ngIf="error()">{{ error() }}</div>

  <button (click)="submit()" [disabled]="loading()">{{ loading() ? 'Logging in…' : 'Log in' }}</button>

  <p>No account? <a routerLink="/register">Register as a business</a></p>
</div>
