<main class="auth-page">
  <ui-card class="auth-form">
    <p class="eyebrow">LIST YOUR PROPERTY</p>
    <h1>Build your business presence</h1>
    <p class="auth-copy">Create an account to publish and manage property listings.</p>

    <label>
      Company name
      <input uiInput type="text" [(ngModel)]="companyName" name="companyName" autocomplete="organization" required />
    </label>

    <label>
      Email
      <input uiInput type="email" [(ngModel)]="email" name="email" autocomplete="email" required />
    </label>

    <label>
      Phone (optional)
      <input uiInput type="tel" [(ngModel)]="contactPhone" name="contactPhone" autocomplete="tel" />
    </label>

    <label>
      Password
      <input uiInput type="password" [(ngModel)]="password" name="password" autocomplete="new-password" required />
    </label>

    <ui-toast [message]="error()" tone="error" />

    <button uiButton="primary" type="button" (click)="submit()" [disabled]="loading()">
      {{ loading() ? 'Creating account…' : 'Create account' }}
    </button>

    <p class="auth-switch">Already registered? <a routerLink="/login">Log in</a></p>
  </ui-card>
</main>
